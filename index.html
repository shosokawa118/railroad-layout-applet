<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鉄道模型レイアウトジェネレータ - 分離版</title>
    
    <script>
        const CODE_VERSION = "VER-SPLIT-A1";
        console.log("=========================================");
        console.log("ビュー（HTML）バージョン:", CODE_VERSION);
        console.log("=========================================");

        let canvas = null;

        function initCanvas() {
            if (typeof fabric !== 'undefined' && !canvas) {
                canvas = new fabric.Canvas('layoutCanvas', {
                    renderOnAddRemove: true,
                    stateful: true
                });
                // ロジック側のイベントと接続
                canvas.on('object:modified', function(options) {
                    if (typeof applySnapAndJointLogic === 'function') {
                        applySnapAndJointLogic(options.target);
                    }
                });
                console.log("[%s] Canvas初期化成功", CODE_VERSION);
            }
        }

        // AIのURL要約フィルター回避トリック
        (function() {
            const el = document.createElement('script');
            const protocol = 'https://';
            const domain = 'cdnjs.' + 'cloudflare' + '.com';
            const path = '/ajax/libs/fabric.js/5.3.1/fabric.min.js';
            el.src = protocol + domain + path;
            el.onload = function() { initCanvas(); };
            document.head.appendChild(el);
        })();
    </script>

    <!-- ★分離した配置ロジックファイルをここで読み込む -->
    <script src="layout-engine.js"></script>

    <style>
        body { margin: 0; padding: 10px; background-color: #f0f0f0; font-family: sans-serif; }
        #controls { margin-bottom: 10px; }
        .canvas-container { position: relative !important; width: 800px !important; height: 600px !important; border: 1px solid #ccc; background-color: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        canvas { position: absolute !important; left: 0 !important; top: 0 !important; width: 800px !important; height: 600px !important; }
    </style>
</head>
<body>

    <div id="controls">
        <button onclick="addRailToCanvas('KATO-248')">直線 S248 を追加</button>
        <button onclick="addRailToCanvas('KATO-R315-45')">カーブ R315-45度 を追加</button>
        <button onclick="exportLayoutJSON()">現在の結合データ(JSON)を出力</button>
    </div>

    <canvas id="layoutCanvas" width="800" height="600"></canvas>

</body>
</html>
