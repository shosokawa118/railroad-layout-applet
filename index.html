<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>鉄道模型レイアウトジェネレータ - カタログ実装版</title>
    
    <script>
        const CODE_VERSION = "VER-FIX-PATH-L2";
        console.log("=========================================");
        console.log("ビュー（HTML）バージョン:", CODE_VERSION);
        console.log("=========================================");

        let canvas = null;

        function startApplication() {
            if (typeof fabric !== 'undefined' && !canvas) {
                canvas = new fabric.Canvas('layoutCanvas', {
                    renderOnAddRemove: true,
                    stateful: true,
                    allowTouchScrolling: false
                });

                canvas.on('object:modified', function(options) {
                    if (typeof applyClusterSnapLogic === 'function') {
                        applyClusterSnapLogic(options.target);
                    }
                });

                initCameraControls();
                if (typeof initTouchControls === 'function') initTouchControls();

                console.log("[%s] Canvas初期化成功。初期配置データをロードします...", CODE_VERSION);
                
                if (typeof loadDebugSampleLayout === 'function') {
                    loadDebugSampleLayout();
                }
            }
        }

        (function() {
            const el = document.createElement('script');
            const protocol = 'https://';
            const domain = 'cdnjs.' + 'cloudflare' + '.com';
            const path = '/ajax/libs/fabric.js/5.3.1/fabric.min.js';
            el.src = protocol + domain + path;
            el.onload = function() { 
                const hm = document.createElement('script');
                hm.src = 'https://' + 'cdnjs.' + 'cloudflare' + '.com/ajax/libs/hammer.js/2.0.8/hammer.min.js';
                hm.onload = function() { startApplication(); };
                document.head.appendChild(hm);
            };
            document.head.appendChild(el);
        })();
    </script>

    <script src="parts-catalog.js"></script>
    <script src="layout-engine.js"></script>
    <script src="sample-data.js"></script>
    <script src="snap-manager.js"></script>


    <style>
        body { margin: 0; padding: 10px; background-color: #f0f0f0; font-family: sans-serif; touch-action: none; }
        #controls { margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
        .canvas-container { position: relative !important; width: 800px !important; height: 600px !important; border: 1px solid #ccc; background-color: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        canvas { position: absolute !important; left: 0 !important; top: 0 !important; width: 800px !important; height: 600px !important; }
        button { padding: 4px 8px; border-radius: 4px; border: 1px solid #999; background-color: #fff; cursor: pointer; }
        button:hover { background-color: #eee; }
    </style>
</head>
<body>

    <div id="controls">
        <button onclick="addRailToCanvas('KATO-248')" style="background-color: #e0f7fa;">直線 S248</button>
        <button onclick="addRailToCanvas('KATO-S60')">補助 S60</button>
        <button onclick="addRailToCanvas('KATO-S64')">補助 S64</button>
        <button onclick="addRailToCanvas('KATO-R315-45')" style="background-color: #e8f5e9;">曲線 R315</button>
        <button onclick="addRailToCanvas('KATO-R481-15')">補助 R481-15</button>
        <button onclick="addRailToCanvas('KATO-EP4-R')" style="background-color: #fff3e0; font-weight: bold; border-color: #ff9800;">4番ポイント(右)</button>
        <button onclick="exportLayoutJSON()" style="background-color: #eceff1;">JSON出力</button>
        <button onclick="loadDebugSampleLayout()" style="background-color: #ff9500; color: #fff; border: none;">サンプル再読込</button>
    </div>

    <canvas id="layoutCanvas" width="800" height="600"></canvas>

    <script>
        function initCameraControls() {
            canvas.on('mouse:wheel', function(opt) {
                let delta = opt.e.deltaY; let zoom = canvas.getZoom(); zoom *= 0.999 ** delta;
                if (zoom > 20) zoom = 20; if (zoom < 0.1) zoom = 0.1;
                canvas.zoomToPoint({ x: opt.e.offsetX, y: opt.e.offsetY }, zoom);
                opt.e.preventDefault(); opt.e.stopPropagation();
            });

            let isSpacePressed = false; let isDraggingCamera = false; let lastX, lastY;
            window.addEventListener('keydown', e => { if (e.code === 'Space') { isSpacePressed = true; canvas.defaultCursor = 'grab'; } });
            window.addEventListener('keyup', e => { if (e.code === 'Space') { isSpacePressed = false; canvas.defaultCursor = 'default'; } });
            canvas.on('mouse:down', opt => { if (isSpacePressed) { isDraggingCamera = true; canvas.defaultCursor = 'grabbing'; lastX = opt.e.clientX; lastY = opt.e.clientY; } });
            canvas.on('mouse:move', opt => {
                if (isDraggingCamera) {
                    let vpt = canvas.viewportTransform.slice();
                    vpt += opt.e.clientX - lastX; vpt += opt.e.clientY - lastY;
                    canvas.setViewportTransform(vpt); canvas.requestRenderAll(); lastX = opt.e.clientX; lastY = opt.e.clientY;
                }
            });
            canvas.on('mouse:up', () => { if (isDraggingCamera) { isDraggingCamera = false; canvas.defaultCursor = isSpacePressed ? 'grab' : 'default'; } });
        }

        function initTouchControls() {
            if (typeof Hammer === 'undefined') return;
            const touchArea = document.getElementById('layoutCanvas').parentElement;
            const mc = new Hammer.Manager(touchArea);
            const pinch = new Hammer.Pinch();
            const pan = new Hammer.Pan({ direction: Hammer.DIRECTION_ALL, pointers: 2 });
            pinch.recognizeWith(pan); mc.add([pinch, pan]);

            let adjustZoom = 1; let adjustPosX = 0; let adjustPosY = 0;
            mc.on("pinchstart pinchmove", function(e) {
                if (e.type === 'pinchstart') adjustZoom = canvas.getZoom();
                let zoom = adjustZoom * e.scale; if (zoom > 20) zoom = 20; if (zoom < 0.1) zoom = 0.1;
                canvas.zoomToPoint({ x: e.center.x, y: e.center.y }, zoom);
            });
            mc.on("panstart panmove", function(e) {
                let vpt = canvas.viewportTransform.slice();
                if (e.type === 'panstart') { adjustPosX = vpt; adjustPosY = vpt; }
                vpt = adjustPosX + e.deltaX; vpt = adjustPosY + e.deltaY;
                canvas.setViewportTransform(vpt); canvas.requestRenderAll();
            });
        }
    </script>
</body>
</html>
